name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  MONOIO_FORCE_LEGACY_DRIVER: 1

jobs:
  build_and_test:
    name: Build, Clippy, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --lib

      - name: Run Cross-Thread Integration Tests
        run: cargo test --test test_cross_thread

      - name: Run End-to-End Integration Tests (serial)
        run: |
          set -o pipefail
          cargo test --test test_server_e2e -- --test-threads=1 2>&1 | tee e2e.log || {
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "### E2E Test Failures" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              sed -n '/failures:/,$p' e2e.log | head -n 300 >> "$GITHUB_STEP_SUMMARY" || cat e2e.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            grep -n -A 2 "panicked at" e2e.log | head -n 10 | while read -r line; do
              echo "::error title=Panic::$line"
            done
            exit 1
          }

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Code Coverage & Step Summary
        run: |
          ./scripts/generate_coverage.sh
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cargo llvm-cov report >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Verify Zero Hardware Regression Invariants
        run: python3 scripts/check_perf_regression.py


  redis_tcl_suites:
    name: Redis TCL compatibility suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install tclsh
        run: sudo apt-get update && sudo apt-get install -y tcl

      - name: Build release binary
        run: cargo build --release

      - name: Run the core TCL suites
        run: |
          set -o pipefail
          SKIP_BUILD=1 bash scripts/run_redis_test_suite.sh 16379 all 2>&1 | tee /tmp/rudis_tcl_suites.log

      # Annotations are visible on the run page without downloading logs.
      - name: Report failing TCL tests
        if: failure()
        run: |
          grep -E '\[(err|exception|TIMEOUT)\]|Failed:|Killing still running' /tmp/rudis_tcl_suites.log \
            | head -30 | while IFS= read -r line; do echo "::error title=TCL::${line}"; done

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rudis-tcl-server-log
          path: |
            /tmp/rudis_tcl_test_16379.log
            /tmp/rudis_tcl_suites.log
