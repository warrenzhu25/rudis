name: CI

# The checks every push and pull request must pass, chosen to be
# deterministic on a hosted runner (4 vCPUs, shared). The timing-heavy rest
# (debug e2e with coverage; the replication, persistence and cluster TCL
# suites) runs nightly in extended.yml, and all of it gates every merge in
# scripts/ci_local.sh on a dedicated host.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Skips tests too big for a hosted runner (16 GB, 4 vCPUs), such as the
  # 2 GiB full sync; scripts/ci_local.sh runs them.
  RUDIS_SKIP_HEAVY_TESTS: "1"

jobs:
  build_and_test:
    name: Build, Clippy, and Tests
    runs-on: ubuntu-latest
    env:
      # Many in-process servers per test binary; the legacy (epoll) driver
      # avoids io_uring memlock exhaustion on older runner kernels. The
      # production io_uring driver is covered by `io_uring_tests` and the
      # TCL job below. The e2e suite on this driver, with coverage, runs in
      # extended.yml.
      MONOIO_FORCE_LEGACY_DRIVER: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --lib

      - name: Build without the experimental features (production build)
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --lib --no-default-features

      - name: Run Cross-Thread Integration Tests
        run: cargo test --test test_cross_thread

      # TLS clients, adversarial parser input, cross-shard overload, and
      # RDB/DUMP compatibility with Valkey (skipped where it is not installed).
      - name: Run the other integration tests
        run: >-
          cargo test --test test_tls_e2e --test test_fuzz_parsers
          --test test_resilience_chaos --test test_redis_rdb_compat
          -- --test-threads=1

      - name: Build Optimized Release Binary
        run: cargo build --release


  io_uring_tests:
    name: Tests on the io_uring driver (production default)
    runs-on: ubuntu-latest
    env:
      MONOIO_FORCE_LEGACY_DRIVER: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-uring-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-uring-

      - name: Report io_uring availability
        run: |
          uname -r
          echo "io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo n/a)"
          ulimit -l

      # Every in-process test server keeps its io_uring rings for the life
      # of the test binary, and ring memory counts against RLIMIT_MEMLOCK
      # (8 MB on the runners), so the suite runs out of it part-way and
      # shards fall back to epoll. Lift the limit for these steps, as
      # rudis.service does with LimitMEMLOCK=infinity.
      - name: Run Unit Tests
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --release --lib

      - name: Run Cross-Thread Integration Tests
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --release --test test_cross_thread

      - name: Run End-to-End Integration Tests (serial)
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l
          set -o pipefail
          cargo test --release --test 'e2e_*' -- --test-threads=1 2>&1 | tee e2e.log || {
            # Annotations are readable on the run page (and the public API)
            # without downloading logs.
            sed -n '/^failures:$/,$p' e2e.log | grep -E '^    test_' | head -n 20 | while read -r t; do
              echo "::error title=Failed e2e test::$t"
            done
            grep -A 2 "panicked at" e2e.log | grep -v '^--$' | head -n 30 | while IFS= read -r line; do
              echo "::error title=Panic::$line"
            done
            exit 1
          }

  redis_tcl_suites:
    name: Redis TCL core suites (io_uring)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install tclsh and the Redis CLI tools
        # redis-tools: redis-cli, redis-benchmark, redis-check-{rdb,aof}
        # (no server), which some integration suites drive.
        run: sudo apt-get update && sudo apt-get install -y tcl redis-tools

      - name: Build release binary
        run: cargo build --release

      - name: Run the core TCL suites
        run: |
          set -o pipefail
          SKIP_BUILD=1 bash scripts/run_redis_test_suite.sh 16379 all 2>&1 | tee /tmp/rudis_tcl_suites.log

      # Annotations are visible on the run page without downloading logs.
      - name: Report failing TCL tests
        if: failure()
        run: |
          # Only failures: GitHub shows 10 annotations per step, and each
          # passing suite's "Failed: 0 ()" line used to fill them first.
          # -A1: the line after an [err] says what was expected.
          grep -E -A1 '^\[(err|exception)\]' /tmp/rudis_tcl_suites.log | grep -v '^--$' \
            | head -6 | while IFS= read -r line; do echo "::error title=TCL::${line}"; done
          # The suite and the last test started before a [TIMEOUT].
          awk '/^Testing |^\[(ok|err|skip)\]/ {last = last_suite ? last_suite " / " $0 : $0}
               /^Testing / {last_suite = $0}
               /^\[TIMEOUT\]/ {print "hung in: " last; exit}' /tmp/rudis_tcl_suites.log \
            | while IFS= read -r line; do echo "::error title=TCL timeout::${line}"; done
          # After a [TIMEOUT], the clients state report names the test that hung.
          grep -E -A4 '^\[TIMEOUT\]' /tmp/rudis_tcl_suites.log | grep -v '^--$' | head -n 5 \
            | while IFS= read -r line; do echo "::error title=TCL timeout::${line}"; done
          # Which suite and test were running (a [TIMEOUT] names neither).
          last=$(grep -E '^Testing |^\[(ok|err|skip)\]' /tmp/rudis_tcl_suites.log | tail -n 3 | tr '\n' ' ')
          echo "::error title=TCL last tests::${last}"

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rudis-tcl-server-log
          path: |
            /tmp/rudis_tcl_test_16379.log
            /tmp/rudis_tcl_suites.log

  supply_chain:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Advisories (RustSec), licenses, banned/duplicate crates and sources,
      # per deny.toml.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
