name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  MONOIO_FORCE_LEGACY_DRIVER: 1

jobs:
  build_and_test:
    name: Build, Clippy, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --lib

      - name: Run Cross-Thread Integration Tests
        run: cargo test --test test_cross_thread

      - name: Run End-to-End Integration Tests (serial)
        run: |
          set -o pipefail
          cargo test --test test_server_e2e -- --test-threads=1 2>&1 | tee e2e.log || {
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "### E2E Test Failures" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              sed -n '/failures:/,$p' e2e.log | head -n 300 >> "$GITHUB_STEP_SUMMARY" || cat e2e.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            grep -n -A 2 "panicked at" e2e.log | head -n 10 | while read -r line; do
              echo "::error title=Panic::$line"
            done
            exit 1
          }

