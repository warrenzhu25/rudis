[package]
name = "rudis"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.12"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
core_affinity = "0.8.3"
crc16 = "0.4.0"
flume = "0.12.0"
hashbrown = "0.17.1"
fxhash = "0.2.1"
smallvec = "1.14"
monoio = { version = "0.2.4", features = ["sync", "zero-copy"] }
socket2 = { version = "0.6.5", features = ["all"] }
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
sha1 = "0.11.0"
libc = "0.2"
tikv-jemallocator = { version = "0.7.0", features = ["stats", "background_threads_runtime_support"] }
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats", "use_std"] }
rustls = "0.23.45"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
ring = "0.17"
rcgen = "0.14.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
io-uring = "0.6"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1
opt-level = 3
lto = "thin"

# Maximum optimization for shipped binaries: `cargo build --profile dist`.
# Fat LTO with one codegen unit measured +1-4% throughput (within noise) for
# ~3x the build time, so day-to-day release builds and tests keep thin LTO.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1



# monoio 0.2.4 with Rudis's cross-thread wake and idle-poll changes; see
# vendor/monoio/RUDIS_PATCHES.md. Upstream: https://github.com/bytedance/monoio
[patch.crates-io]
monoio = { path = "vendor/monoio" }
