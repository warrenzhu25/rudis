# Rudis Production Configuration
# Format is fully compatible with standard redis.conf syntax

# Network
bind 127.0.0.1 -::1
# With no requirepass, protected mode only admits loopback clients.
protected-mode yes
port 6379
maxclients 10000

# Worker Threads (Thread-per-core io_uring architecture)
# If left commented, automatically defaults to min(available_cores, 8)
# threads 8

# Memory Management & Eviction
# maxmemory bounds used_memory (what eviction counts), not the process RSS:
# allocator fragmentation, connection buffers and free table slots sit on top
# (up to ~1.2-1.4x under heavy eviction churn of very small keys). Set it to
# about 75% of the memory available to rudis. MEMORY DOCTOR / MEMORY STATS
# show how far RSS runs past it.
maxmemory 4gb
maxmemory-policy allkeys-lru

# NVMe Tiered Storage Thresholds
tiered-offload-threshold 60
tiered-upload-threshold 80

# Persistence (Append-Only File)
appendonly yes
dir /var/lib/rudis

# Security
# requirepass "changeme_in_production"
# DEBUG (and MODULE) are refused by default, as in Redis: DEBUG can crash,
# stall or reload the server. "local" allows them from loopback clients only.
# Config file / command line only; CONFIG SET can't change it.
# enable-debug-command no

# TLS Configuration (Optional)
# tls-port 6380
# tls-cert-file /etc/rudis/tls/rudis.crt
# tls-key-file /etc/rudis/tls/rudis.key

# Cluster Mode
cluster-enabled no

# Non-Redis command families (JSON.*, BF.*, CF.*, CMS.*, TOPK.*, FT.*, SEMANTIC.*,
# CRDT.*, LLM.*, MCP.*, XDP.*). Off by default: most of their writes are not
# written to the AOF or replicated, so that data is lost on restart/failover.
# enable-experimental-commands no
