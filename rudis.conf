# Rudis Production Configuration
# Format is fully compatible with standard redis.conf syntax

# Network
bind 0.0.0.0
port 6379
maxclients 10000

# Worker Threads (Thread-per-core io_uring architecture)
# If left commented, automatically defaults to min(available_cores, 8)
# threads 8

# Memory Management & Eviction
maxmemory 4gb
maxmemory-policy allkeys-lru

# NVMe Tiered Storage Thresholds
tiered-offload-threshold 60
tiered-upload-threshold 80

# Persistence (Append-Only File)
appendonly yes
dir /var/lib/rudis

# Security
# requirepass "changeme_in_production"

# TLS Configuration (Optional)
# tls-port 6380
# tls-cert-file /etc/rudis/tls/rudis.crt
# tls-key-file /etc/rudis/tls/rudis.key

# Cluster Mode
cluster-enabled no
